<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Landing</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Sakai Landing Page" />
        <link rel="icon" type="image/x-icon" href="favicon.ico" />
        <link rel="preload" as="image" href="/layout/images/landing/screen-1.png" />
        <!-- Inject fonts only after critical render to guarantee maximum Lighthouse score -->
        <script>
            function loadFonts() {
                var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '/fonts/fonts.css';
                document.head.appendChild(l);
            }
            if(window.requestIdleCallback) { requestIdleCallback(loadFonts); }
            else { window.addEventListener('load', loadFonts); }
        </script>
        <noscript><link rel="stylesheet" href="/fonts/fonts.css" /></noscript>
    </head>
    <body>
        <app-root></app-root>
    </body>
</html>
