<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Dashboard</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Sakai Internal Dashboard" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="theme-color" content="#10b981" />
        <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
        <style>
            @font-face {
                font-family: 'Lato';
                src: url('/fonts/lato-400.woff2') format('woff2');
                font-weight: 400;
                font-style: normal;
                font-display: swap;
            }
            @font-face {
                font-family: 'Lato';
                src: url('/fonts/lato-700.woff2') format('woff2');
                font-weight: 700;
                font-style: normal;
                font-display: swap;
            }
            .app-splash-screen {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                width: 100vw;
                position: fixed;
                top: 0;
                left: 0;
                background-color: #f8fafc;
                font-family: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                z-index: 99999;
            }
            .app-splash-spinner {
                width: 48px;
                height: 48px;
                border: 3px solid rgba(16, 185, 129, 0.15);
                border-top-color: #10b981;
                border-radius: 50%;
                animation: app-splash-spin 0.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
            }
            .app-splash-text {
                margin-top: 1.25rem;
                font-size: 0.875rem;
                font-weight: 500;
                letter-spacing: 0.025em;
                color: #64748b;
                animation: app-splash-pulse 1.8s ease-in-out infinite;
            }
            @keyframes app-splash-spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
            @keyframes app-splash-pulse {
                0%, 100% { opacity: 0.6; }
                50% { opacity: 1; }
            }
            @media (prefers-color-scheme: dark) {
                .app-splash-screen {
                    background-color: #0f172a;
                }
                .app-splash-spinner {
                    border-color: rgba(52, 211, 153, 0.2);
                    border-top-color: #34d399;
                }
                .app-splash-text {
                    color: #94a3b8;
                }
            }
        </style>
    </head>

    <body>
        <app-root>
            <div class="app-splash-screen" role="status" aria-live="polite" aria-label="Memuat aplikasi">
                <div class="app-splash-spinner"></div>
                <div class="app-splash-text">Memuat Dashboard...</div>
            </div>
        </app-root>
        <script>
            if ('serviceWorker' in navigator) {
                if (document.readyState === 'complete') {
                    navigator.serviceWorker.register('/sw.js').catch(function () {});
                } else {
                    window.addEventListener('load', function () {
                        navigator.serviceWorker.register('/sw.js').catch(function () {});
                    });
                }
            }
        </script>
    </body>
</html>
